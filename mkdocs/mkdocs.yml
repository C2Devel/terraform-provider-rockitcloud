theme:
  name: material
  logo: mkdocs-images/favicon.ico
  favicon: mkdocs-images/favicon.ico
  palette:
    - scheme: hashicorp
      primary: white
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16

  features:
    - content.tabs.link
    - content.code.copy

plugins:
  - search:
      lang:
        - en
  - awesome-pages

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - toc:
      permalink: "#"

extra_css:
     - 'mkdocs-assets/stylesheets/extra.css'
     - "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
extra_javascript:
     - 'mkdocs-assets/stylesheets/extra.js'
