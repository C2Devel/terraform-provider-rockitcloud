name: Publishing of the internal documentation

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      s3_config:
        description: 'S3 configuration for internal documentation'
        required: true

jobs:
  publish-internal-doc:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 'pypy3.10'

    - name: Install s3cmd
      run: sudo pip install s3cmd==2.4.0 mkdocs mkdocs-material mkdocs-awesome-pages-plugin

    - name: Create S3 config
      run: echo "${{ secrets.s3_config }}" > ./.s3cfg

    - name: Run script
      env:
        S3_CMD_CFG_LOCATION: "./.s3cfg"
      run: ./scripts/build-docs.sh --push
