name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: 'Previous semver version (e.g., 25.5.5)'
        required: true
        type: string
  workflow_call:
    inputs:
      previous_version:
        description: 'Previous semver version (e.g., 25.5.5)'
        required: true
        type: string
    secrets:
      APP_ID:
        description: 'GitHub App ID'
        required: true
      APP_PEM:
        description: 'GitHub App private key'
        required: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Create provider-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          owner: C2Devel
          repositories: terraform-provider-rockitcloud
          permission-contents: write

      - uses: actions/checkout@v5
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate next minor version
        id: version
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          PREVIOUS_VERSION=${PREVIOUS_VERSION#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "${PREVIOUS_VERSION}"
          echo "next_version=${MAJOR}.$((10#${MINOR} + 1)).0" >> "${GITHUB_OUTPUT}"

      - name: Update CHANGELOG.md
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          if grep -Fxq "## ${NEXT_VERSION} (Unreleased)" CHANGELOG.md; then
            exit 0
          fi
          {
            echo "## ${NEXT_VERSION} (Unreleased)"
            echo
            if head -n 1 CHANGELOG.md | grep -Fxq '# Changelog'; then
              tail -n +2 CHANGELOG.md
            else
              cat CHANGELOG.md
            fi
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit directly to develop
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains ${NEXT_VERSION}"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "Add changelog entry for v${NEXT_VERSION}"
          git push origin HEAD:develop
