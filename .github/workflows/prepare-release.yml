name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 26.2.7)'
        required: true
        type: string

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Finalize the changelog heading
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/prepare-release.py

      - name: Commit the release changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: develop
          file_pattern: CHANGELOG.md
          commit_message: "Release v${{ steps.release.outputs.version }}"
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
