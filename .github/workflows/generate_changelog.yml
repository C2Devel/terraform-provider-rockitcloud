name: Generate CHANGELOG
on:
  push:
    branches:
      - develop
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:
jobs:
  GenerateChangelog:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci/tools/go.mod
      - run: cd .ci/tools && go install github.com/hashicorp/go-changelog/cmd/changelog-build
      - run: ./.ci/scripts/generate-changelog.sh
      - name: Set commit message
        id: commit-message
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MSG="Update CHANGELOG.md (Manual Trigger)"
          else
            PR_NUMBER="$(git log -1 --pretty=%s |
              sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')"
            MSG="Update CHANGELOG.md for #${PR_NUMBER}"
          fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: develop
          file_pattern: CHANGELOG.md
          commit_message: ${{ steps.commit-message.outputs.message }}
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
