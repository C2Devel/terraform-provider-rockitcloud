name: Building the provider for the public registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  public-release:
    if: github.repository == 'C2Devel/terraform-provider-rockitcloud'
    runs-on: ubuntu-22.04-large
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        clean: true
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21.x

    - name: Verify tag is on develop branch
      run: |
        TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
        echo "Tag commit: $TAG_COMMIT"
        
        DEVELOP_COMMIT=$(git rev-parse origin/develop)
        echo "Develop commit: $DEVELOP_COMMIT"
        
        if git merge-base --is-ancestor $TAG_COMMIT $DEVELOP_COMMIT; then
          echo "Tag is on develop branch"
        else
          echo "Tag commit is not on develop branch"
          exit 1
        fi

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v1'
        args: release --clean --timeout 180m
      env:
        GITHUB_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  wait-for-public-registry:
    needs: public-release
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    outputs:
      version: ${{ steps.wait.outputs.version }}
    steps:
    - name: Wait for the released version in Terraform Registry
      id: wait
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        deadline=$((SECONDS + 1800))
        while (( SECONDS < deadline )); do
          if curl --fail --silent --show-error --max-time 10 \
            https://registry.terraform.io/v1/providers/c2devel/rockitcloud/versions \
            | jq --exit-status --arg version "$VERSION" \
              'any(.versions[]; .version == $version and (.platforms | length > 0))' >/dev/null; then
            echo "Provider $VERSION is available in the public Terraform Registry."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for provider $VERSION in the public Terraform Registry."
          sleep 30
        done

        echo "::error::Provider $VERSION did not appear in the public Terraform Registry within 30 minutes. Check the release and its Terraform Registry sync."
        exit 1

  private-release:
    needs: wait-for-public-registry
    uses: ./.github/workflows/private-release.yml
    secrets: inherit

  publish-internal-docs:
    needs: private-release
    uses: ./.github/workflows/publish-internal-docs.yml
    secrets: inherit

  update-changelog:
    needs: [wait-for-public-registry, publish-internal-docs]
    uses: ./.github/workflows/update-changelog.yml
    with:
      previous_version: ${{ needs.wait-for-public-registry.outputs.version }}
    secrets: inherit
